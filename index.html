<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM Droit Romain - Master Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d4af37; /* Or pour le côté académique */
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #fdfdfd;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: var(--primary);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 20px;
        }

        /* Barre de progression et Timer */
        .sticky-stats {
            position: sticky;
            top: 0;
            background: white;
            padding: 15px;
            border-bottom: 1px solid #ddd;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .progress-bar-container {
            background: #eee;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            width: 100%;
        }

        .progress-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.3s;
        }

        .question-block {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #eaeff2;
            border-radius: 10px;
            transition: 0.3s;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: block;
            color: #1a1a1a;
        }

        .option {
            display: block;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #ddd;
            transition: 0.2s;
        }

        .option:hover { background: #f9f9f9; border-color: var(--accent); }

        /* Correction visuelle */
        .text-correct { color: var(--success) !important; font-weight: bold; }
        .text-wrong { color: var(--error) !important; font-weight: bold; }
        .bg-correct { background-color: #e8f5e9 !important; border-color: var(--success); }
        .bg-wrong { background-color: #ffebee !important; border-color: var(--error); }

        .correction-note {
            margin-top: 15px;
            padding: 10px;
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            display: none;
        }

        #submit-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.3rem;
            cursor: pointer;
            font-variant: small-caps;
        }

        #submit-btn:hover { background: #1a252f; }

        .final-hero {
            display: none;
            text-align: center;
            padding: 50px;
            background: var(--primary);
            color: white;
            border-radius: 15px;
            margin-top: 30px;
        }

        .bravo-text {
            font-size: 3rem;
            color: var(--accent);
            margin: 0;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Droit Romain : Obligations & Délits</h1>
        <p>Session d'examen blanc</p>
    </header>

    <div class="sticky-stats">
        <div class="stats-row">
            <span>Progression : <span id="progress-text">0%</span></span>
            <span>Temps écoulé : <span id="timer">00:00</span></span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <form id="quiz-form">
        <div id="quiz-content"></div>
        <button type="button" id="submit-btn" onclick="validateQuiz()">Soumettre ma copie</button>
    </form>

    <div id="finalHero" class="final-hero">
        <div id="victory-content">
            <h2 id="scoreTitle"></h2>
            <p id="scoreSub"></p>
        </div>
        <button onclick="location.reload()" style="background: var(--accent); color: white; padding: 10px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 20px;">Relancer un test</button>
    </div>
</div>

<script>
    // Configuration des questions (Mêmes données que précédemment)
    const rawData = [
        { q: "1. Les vices du consentement en droit romain sont :", options: ["le dol (au sens de la faute lourde)", "le dol (au sens du mensonge)", "l'erreur (obstacle)", "la crainte révérencielle"], correct: [1, 2] },
        { q: "2. En droit romain des obligations, le louage de services :", options: ["ne permet pas de recruter des ouvriers", "permet d'employer des esclaves", "permet de recruter un avocat", "ne permet pas d'engager un avocat"], correct: [1, 3] },
        { q: "3. Le proto-consensualisme de l'époque féodale :", options: ["est un retour au consensualisme archaïque", "correspond à un engagement par promesse", "marque une tendance à la laïcisation", "pratique résiduelle « contracta »"], correct: [1, 2] },
        { q: "4. La stipulatio :", options: ["forme de promesse (fides facta)", "a donné naissance à la sponsio", "mode basé sur un serment", "clause de résolution"], correct: [0, 2] },
        { q: "5. En droit romain, la sponsio :", options: ["sponsorise les clients", "contrat réel", "interrogation orale solennelle", "base de la stipulatio"], correct: [2, 3] },
        { q: "6. Le mutuum est :", options: ["sanctionné moralement", "contrat consensuel", "prêt de consommation", "prêt à la consommation"], correct: [2, 3] },
        { q: "7. Le préteur à Rome :", options: ["pontife", "magistrat qui fixe le procès", "juge du fond", "prêteur d'argent"], correct: [1] },
        { q: "8. La loi Poetalia Papiria distingue :", options: ["contrat et délit", "indemnité et amende", "contrainte physique/morale", "obligé et obligation"], correct: [3] },
        { q: "9. En droit romain, la fiducie :", options: ["essor consensuel", "identique au trust", "personne de confiance", "dérive de la loyauté (contrats réels)"], correct: [3] },
        { q: "10. Action « de pauperie », le propriétaire peut :", options: ["dommages-intérêts", "exil", "abandon noxal", "abandon du fils"], correct: [0, 2] },
        { q: "11. Délit d'injuria étendu par le préteur :", options: ["quasi-délits", "sacrilège", "atteintes morales", "lèse-majesté"], correct: [2] },
        { q: "12. Délits époque franque, on s'intéresse à :", options: ["pas l'intention", "matériel", "intention > matériel", "autant aux deux"], correct: [0, 1] },
        { q: "13. Le Digeste :", options: ["Dioclétien", "Archaïque", "Justinien (VIe s.)", "École de pensée"], correct: [2] },
        { q: "14. À Rome, le foenus :", options: ["taux réduit", "prêt consommation", "prêt à intérêt", "similaire mutuum"], correct: [2, 3] },
        { q: "15. Principe du Digeste :", options: ["mort du coupable = fin action publique", "action suit le coupable", "mort commence avec crime", "crime cesse avec peine"], correct: [0] },
        { q: "16. Origine noxalité :", options: ["individuelle", "archaïque", "droit de s'emparer du coupable", "venger la perte"], correct: [1, 2] },
        { q: "17. Renaissance droit romain :", options: ["monastères", "canonistes", "imprimerie", "change mœurs"], correct: [1] },
        { q: "18. Le id quod interest :", options: ["différent quanti ea res", "barème", "calcul taux", "intérêt à éviter dommage"], correct: [3] },
        { q: "19. Contrat de societas :", options: ["bénéfice au fondateur", "consensuel", "pratique commerciale", "prolongement paterfamilias"], correct: [1, 3] },
        { q: "20. Irresponsabilité délictuelle :", options: ["10 ans", "opium", "femme", "impubère"], correct: [3] },
        { q: "21. Bas Moyen Âge, romanistes/canonistes :", options: ["nécessité", "légitime défense", "rôle intention", "causalité"], correct: [2] },
        { q: "22. Prêt à intérêt :", options: ["nauticum foenus", "interdit pontifes", "10 commandements", "mutuum initial"], correct: [0] },
        { q: "23. Vices cachés :", options: ["exécution", "utilité", "violence", "pas une lésion"], correct: [3] },
        { q: "24. Avant Poetalia Papiria :", options: ["nexum", "solo consensu", "locatio", "mandat"], correct: [0] },
        { q: "25. Saint Ambroise :", options: ["volonté", "faute lourde", "responsable/non coupable", "pas de responsabilité sans faute"], correct: [3] },
        { q: "26. Laïcisation obligations :", options: ["synthèse civil/naturel", "plus de serment", "code européen", "réduction tribunaux Église"], correct: [3] },
        { q: "27. Wergeld :", options: ["mercenaire", "composition homicide", "contrepartie", "main-d'œuvre"], correct: [1] },
        { q: "28. Fiducie classique :", options: ["trust", "consensuel", "retour propriété", "crédit impôt"], correct: [2] },
        { q: "29. Libre arbitre (Bas MA) :", options: ["sui generis", "hérésies", "bonnes mœurs", "responsabilité"], correct: [2, 3] },
        { q: "30. Action d'injuria :", options: ["1 mois", "1 an", "transmissible héritiers (victime)", "transmissible (auteur)"], correct: [1] },
        { q: "31. Abandon noxal :", options: ["considération animal", "droit romain", "fils/esclave", "idée canonique"], correct: [1, 2] },
        { q: "32. Serment promissoire :", options: ["réel", "formaliste franque", "procureurs", "gestes"], correct: [1] },
        { q: "33. Notion de vol :", options: ["furtum (chose)", "pas escroquerie", "plus large que moderne", "abus confiance/usage"], correct: [2, 3] },
        { q: "34. Procès romain :", options: ["3 étapes", "juge accorde action", "préteur tranche", "in jure / apud iudicem"], correct: [3] },
        { q: "35. Injuria :", options: ["blessure physique", "sorcellerie", "tort animaux", "adultère"], correct: [0] },
        { q: "36. Répression franque :", options: ["roi seul", "pas vengeance", "autorité intervient peu", "talion seul"], correct: [2] },
        { q: "37. Serment Moyen Âge :", options: ["juge dispense", "ariens", "Dieu témoin", "perpétuel"], correct: [2] },
        { q: "38. Prêt production :", options: ["maritime", "commodatum", "sans intérêt", "outil"], correct: [0, 3] },
        { q: "39. Societas :", options: ["personne morale", "limitée apports", "commun apports", "pas intuitu personae"], correct: [2] },
        { q: "40. Cause (Bas MA) :", options: ["moralité", "forme", "objet", "bonne cause"], correct: [0, 3] },
        { q: "41. Vices cachés :", options: ["édiles curules", "renonce vendeur", "amiable", "organes"], correct: [0] },
        { q: "42. XII Tables :", options: ["corruption", "bannum", "lésions corporelles", "sorcellerie"], correct: [2, 3] },
        { q: "43. Expensilatio :", options: ["littéral", "agricole", "expansion", "mandat"], correct: [0] },
        { q: "44. Droit savant (XIIIe) :", options: ["consentement", "anti-canon", "huissiers", "Philippe le Bel"], correct: [0] },
        { q: "45. Louage :", options: ["terres soldats", "expansion urbaine", "abusus", "pas ouvrage futur"], correct: [1] },
        { q: "46. Fin vengeance :", options: ["talion interdit", "poena vs rei persecurio", "civil/commercial", "plus d'indemnités"], correct: [1, 3] },
        { q: "47. Serment simplifié :", options: ["réel", "corporaliter", "touche chose sainte", "pas nom Dieu"], correct: [1, 2] },
        { q: "48. Société franque :", options: ["terre secondaire", "pas parents", "débits=vente", "distinction contrats/délits"], correct: [3] },
        { q: "49. Inquisitoire (XIIIe) :", options: ["sanction civile", "peine vs dommages", "fusion", "assimilation"], correct: [1] },
        { q: "50. Nexum :", options: ["maritime", "per aes et libram", "noxalité", "consensuel"], correct: [1] },
        { q: "51. Mutuum :", options: ["faible valeur", "res mancipi", "famille", "consensuel"], correct: [0] },
        { q: "52. Délit civil :", options: ["paie somme", "tarif légal", "interrogé", "infamie"], correct: [1, 3] },
        { q: "53. Simple promesse :", options: ["contourne", "pas obligation", "objet", "consensualisme"], correct: [3] },
        { q: "54. Legis Aquiliae :", options: ["unilatérale", "administrative", "privée", "pénale double"], correct: [2, 3] },
        { q: "55. Jurisprudence :", options: ["jurisconsultes", "coutume", "préteur", "tribun"], correct: [0] },
        { q: "56. Seul dommage compensé :", options: ["incendie", "écroulement voisin", "vol", "empoisonnement"], correct: [1] },
        { q: "57. XII Tables :", options: ["pudeur", "soufflets (amende)", "vie privée", "pas préjudice"], correct: [1] },
        { q: "58. Dépôt :", options: ["témoin", "bon état", "formel", "régulier"], correct: [1] },
        { q: "59. Deux actions :", options: ["exécutoire", "indemnitaire", "pénales/réipersécutoires", "lapidaires"], correct: [2] },
        { q: "60. Fides :", options: ["paix", "consensuels", "banque", "réels"], correct: [1, 3] }
    ];

    // Mélange des questions (Feature Shuffle)
    const quizData = rawData.sort(() => Math.random() - 0.5);

    let startTime = Date.now();
    setInterval(() => {
        const delta = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(delta / 60)).padStart(2, '0');
        const s = String(delta % 60).padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;
    }, 1000);

    function init() {
        const content = document.getElementById('quiz-content');
        quizData.forEach((item, index) => {
            const block = document.createElement('div');
            block.className = 'question-block';
            block.id = `block-${index}`;
            block.innerHTML = `
                <span class="question-text">${item.q}</span>
                ${item.options.map((opt, i) => `
                    <label class="option" id="label-${index}-${i}">
                        <input type="checkbox" name="q${index}" value="${i}" onchange="updateProgress()"> ${opt}
                    </label>
                `).join('')}
                <div class="correction-note" id="note-${index}"></div>
            `;
            content.appendChild(block);
        });
    }

    function updateProgress() {
        let answered = 0;
        for(let i=0; i<quizData.length; i++) {
            if(document.querySelector(`input[name="q${i}"]:checked`)) answered++;
        }
        const pct = Math.round((answered/quizData.length)*100);
        document.getElementById('progressFill').style.width = pct + "%";
        document.getElementById('progress-text').innerText = pct + "%";
    }

    function launchFireworks() {
        var duration = 5 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

        function randomInRange(min, max) { return Math.random() * (max - min) + min; }

        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);
            var particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }

    function validateQuiz() {
        let score = 0;
        quizData.forEach((item, index) => {
            const block = document.getElementById(`block-${index}`);
            const note = document.getElementById(`note-${index}`);
            const selected = Array.from(document.querySelectorAll(`input[name="q${index}"]:checked`)).map(el => parseInt(el.value));
            const isCorrect = JSON.stringify(selected.sort()) === JSON.stringify(item.correct.sort());

            if (isCorrect) {
                score++;
                block.classList.add('bg-correct');
            } else {
                block.classList.add('bg-wrong');
                note.innerHTML = `<strong>Correction :</strong> ${item.correct.map(i => item.options[i]).join(' & ')}`;
                note.style.display = 'block';
            }

            item.options.forEach((_, i) => {
                const label = document.getElementById(`label-${index}-${i}`);
                if (item.correct.includes(i)) label.classList.add('text-correct');
                else if (document.querySelector(`input[name="q${index}"][value="${i}"]`).checked) label.classList.add('text-wrong');
            });
        });

        const hero = document.getElementById('finalHero');
        const title = document.getElementById('scoreTitle');
        const sub = document.getElementById('scoreSub');
        
        hero.style.display = 'block';
        title.innerText = `Résultat : ${score} / ${quizData.length}`;

        if (score === quizData.length) {
            sub.innerHTML = `<span class="bravo-text">Grand Bravo !</span><br>Sujet maîtrisé à 100%.`;
            launchFireworks();
        } else {
            sub.innerText = "Analyse tes erreurs et retente ta chance !";
        }
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    init();
</script>
</body>
</html>
